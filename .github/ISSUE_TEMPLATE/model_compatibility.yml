name: Model compatibility report
description: Report how the integration behaves with a specific AprilAire cloud device
title: "[Compatibility]: "
labels:
  - device support
  - needs tester
body:
  - type: markdown
    attributes:
      value: |
        Compatibility reports are especially helpful right now.

        Even if a device only partly works, please report it.
        Review generated diagnostics before public upload. Diagnostics from
        older integration versions may expose stable identifiers.
  - type: input
    id: model
    attributes:
      label: AprilAire model
      placeholder: E100W
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
  - type: input
    id: app_version
    attributes:
      label: AprilAire Healthy Air app version
  - type: dropdown
    id: access
    attributes:
      label: Account access
      options:
        - Manage
        - Shared or read-only
        - Unknown
  - type: dropdown
    id: discovery
    attributes:
      label: Was the device discovered?
      options:
        - Yes
        - No
        - Partially
    validations:
      required: true
  - type: textarea
    id: working_features
    attributes:
      label: What works?
      placeholder: |
        - Login succeeds
        - Device shows up
        - Humidity sensors update
        - Advertised controls work
    validations:
      required: true
  - type: textarea
    id: broken_features
    attributes:
      label: What does not work?
      placeholder: |
        - Device is skipped
        - On/off control fails
        - State is stale
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or observations
      description: Include reviewed diagnostics or sanitized field paths and value types. Never include credentials, tokens, names, addresses, stable identifiers, or a raw account payload.
  - type: textarea
    id: evidence
    attributes:
      label: Behavior evidence
      description: Describe what changed on the physical device and what changed in Home Assistant. Clearly note anything inferred rather than directly observed.
