name: Feature request
description: Suggest an improvement for the AprilAire Cloud integration
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include model details, examples, or links if helpful
